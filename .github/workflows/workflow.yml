name: Run Login Script

on:
  workflow_dispatch:
  schedule:
    - cron: "*/8 * * * *"   # every 8 minutes

jobs:
  run-script:
    runs-on: ubuntu-latest

    env:
      LOGIN_URL: ${{ secrets.LOGIN_URL }}
      NO_UPDATE_TEXT: ${{ vars.NO_UPDATE_TEXT }}   # optional override

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Chrome
        uses: browser-actions/setup-chrome@v1
        with:
          chrome-version: stable

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install selenium

      - name: Run script
        id: run_script
        run: python script_v1.py

      - name: Upload log file
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-log
          path: browser.log

      - name: Email on failure
        if: failure()
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          subject: "⚠️ Login script failed — ${{ github.repository }}"
          to: ${{ secrets.MAIL_TO }}
          from: "Visa Bot Alerts <${{ secrets.MAIL_USERNAME }}>"
          body: |
            The login script failed on run ${{ github.run_id }}.
            See the attached log for details.
          attachments: browser.log

      - name: Email on update detected
        if: success() && steps.run_script.outputs.update_found == 'true'
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          subject: "🎉 Possible appointment update — ${{ github.repository }}"
          to: ${{ secrets.MAIL_TO }}
          from: "Visa Bot Alerts <${{ secrets.MAIL_USERNAME }}>"
          body: |
            The page content changed from the expected "no update" state.
            Check the log for details.

            Workflow run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          attachments: browser.log
