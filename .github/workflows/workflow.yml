name: Run Login Script

on:
  workflow_dispatch:
  schedule:
    - cron: "*/8 * * * *"   # every 8 minutes

jobs:
  run-script:
    runs-on: ubuntu-latest

    env:
      LOGIN_URL: ${{ secrets.LOGIN_URL }}
      NO_UPDATE_TEXT: ${{ vars.NO_UPDATE_TEXT }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Chrome
        uses: browser-actions/setup-chrome@v1
        with:
          chrome-version: stable

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install selenium

      - name: Run script
        id: run_script
        run: python script_v1.py
        continue-on-error: true   # so the email step still runs even if the script fails

      - name: Upload log file
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-log
          path: browser.log

      - name: Email log (every run)
        if: always()
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          subject: >-
            ${{ steps.run_script.outcome == 'failure' && '❌ Login script failed' ||
                (steps.run_script.outputs.update_found == 'true' && '🎉 Update found' || '✅ Run OK, no update') }}
            — ${{ github.repository }}
          to: ${{ secrets.MAIL_TO }}
          from: "Visa Bot Alerts <${{ secrets.MAIL_USERNAME }}>"
          body: |
            Run ID: ${{ github.run_id }}
            Outcome: ${{ steps.run_script.outcome }}
            Update found: ${{ steps.run_script.outputs.update_found }}

            Full log attached.

            Workflow run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          attachments: browser.log

      - name: Fail job if script failed
        if: steps.run_script.outcome == 'failure'
        run: exit 1
